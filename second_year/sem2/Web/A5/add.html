<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recipe Manager - Add</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <h1>Add Recipe</h1>
        <p>Insert a new recipe using the PHP backend.</p>
      </header>

      <nav class="top-nav">
        <a href="index.html">Home</a>
        <a href="browse.html">Browse</a>
        <a href="manage.html">Manage</a>
      </nav>

      <section class="panel">
        <p id="create-message" class="message"></p>

        <form id="recipe-create-form">
          <label for="name">Recipe name</label>
          <input
            id="name"
            name="name"
            type="text"
            minlength="2"
            maxlength="120"
            required
          />

          <label for="author">Author</label>
          <input
            id="author"
            name="author"
            type="text"
            minlength="2"
            maxlength="100"
            required
          />

          <label for="type">Type</label>
          <input
            id="type"
            name="type"
            type="text"
            pattern="[A-Za-z ]{3,40}"
            required
          />

          <label for="recipe">Actual recipe</label>
          <textarea
            id="recipe"
            name="recipe"
            rows="7"
            minlength="10"
            maxlength="4000"
            required
          ></textarea>

          <div class="form-actions">
            <button type="submit">Add recipe</button>
            <a class="button-link ghost" href="index.html">Cancel</a>
          </div>
        </form>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
