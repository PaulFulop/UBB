<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recipe Manager - Manage</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <h1>Manage Recipes</h1>
        <p>Edit and delete recipes by selecting entries from the list.</p>
      </header>

      <nav class="top-nav">
        <a href="index.html">Home</a>
        <a href="browse.html">Browse</a>
        <a href="add.html">Add</a>
      </nav>

      <section class="panel">
        <div class="form-actions" style="margin-bottom: 10px">
          <button type="button" id="manage-refresh-btn">Refresh recipes</button>
        </div>

        <p id="manage-message" class="message"></p>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Author</th>
                <th>Type</th>
                <th>Recipe</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="manage-recipes-body"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
